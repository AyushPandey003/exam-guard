<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Exam</title>
<style>
  body { font: 15px system-ui, sans-serif; margin: 0; display: grid; place-items: center; min-height: 100vh; background: #f6f6f4; color: #1d1d1b; }
  main { width: min(560px, 90vw); }
  #status { padding: 12px 14px; border-radius: 8px; background: #fff; border: 1px solid #d8d8d4; }
  #status.bad { border-color: #c0392b; color: #c0392b; }
  #status.good { border-color: #2e7d32; color: #2e7d32; }
  button { margin-top: 12px; padding: 10px 16px; font: inherit; border: 0; border-radius: 8px; background: #1d1d1b; color: #fff; cursor: pointer; }
  ul { padding-left: 18px; }
</style>
</head>
<body>
<main>
  <h2>System check</h2>
  <p>Local test server: http://127.0.0.1:3000. Start it before running the check.</p>
  <p id="session"></p>
  <div id="status" role="status">Not started. Exam locked.</div>
  <button id="go">Run check &amp; unlock exam</button>
</main>
<script>
  const { invoke } = window.__TAURI__.core;
  const { listen } = window.__TAURI__.event;
  const el = document.getElementById('status');

  const button = document.getElementById('go');
  let lastSeq = -1;

  function showError(error) {
    el.className = 'bad';
    el.textContent = `Exam locked. ${error}`;
  }

  function render(update) {
    const p = JSON.parse(update.report.payload);
    // Ignore an older invoke response if a heartbeat has already arrived.
    if (p.seq <= lastSeq) return;
    lastSeq = p.seq;
    document.getElementById('session').textContent = `Session: ${update.nonce} · Report: ${p.seq}`;
    if (update.error || !update.status) {
      showError(update.error || 'No server confirmation.');
      return;
    }
    const locked = update.status.locked;
    el.className = locked ? 'bad' : 'good';
    el.textContent = locked ? 'Exam locked by server.' : 'Server approved. Test exam unlocked.';
    const details = [
      ...update.status.reasons,
      ...p.violations.map(v => `${v.code}: ${v.detail}`),
    ];
    if (details.length) {
      const list = document.createElement('ul');
      for (const detail of details) {
        const item = document.createElement('li');
        item.textContent = detail;
        list.appendChild(item);
      }
      el.appendChild(list);
    }
  }

  // Register before starting a session so the first heartbeat cannot be missed.
  const ready = listen('guard:report', (e) => render(e.payload));
  button.onclick = async () => {
    button.disabled = true;
    el.textContent = 'Contacting local server… Exam locked.';
    try {
      await ready;
      render(await invoke('start_session'));
      button.textContent = 'Monitoring active — close app to stop';
    } catch (error) {
      showError(error);
      button.disabled = false;
    }
  };
</script>
</body>
</html>
